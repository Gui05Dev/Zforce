<!doctype html>
<!-- Template da imagem de compartilhamento (1200 × 630). Renderizado por scripts/og-image.mjs.
     Usa as fontes e as cores do site para o card ficar igual à página que ele anuncia. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Barlow";
    font-weight: 400;
    src: url("/assets/fonts/barlow-400.woff2") format("woff2");
  }
  @font-face {
    font-family: "Barlow";
    font-weight: 600;
    src: url("/assets/fonts/barlow-600.woff2") format("woff2");
  }
  @font-face {
    font-family: "Barlow Condensed";
    font-weight: 700;
    src: url("/assets/fonts/barlow-condensed-700.woff2") format("woff2");
  }

  :root {
    --preto: #0a0a0b;
    --branco: #f4f3ef;
    --cinza: #bcbcc2;
    --brand-blue: #00c2d1;
    --brand-green: #a8e000;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 34px;
    padding: 0 84px;
    background: var(--preto);
    color: var(--branco);
    font-family: "Barlow", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Halo da marca no canto, como o fundo do hero */
  .halo {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(760px 520px at 88% 18%, rgb(0 194 209 / 0.26), transparent 62%),
      radial-gradient(620px 460px at 4% 108%, rgb(0 194 209 / 0.11), transparent 60%);
  }
  /* Malha técnica discreta */
  .grade {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgb(255 255 255 / 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgb(255 255 255 / 0.045) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: linear-gradient(105deg, #000 12%, transparent 72%);
  }
  .conteudo { position: relative; }

  .marca {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 34px;
  }
  .marca img { width: 62px; height: 62px; display: block; }
  .marca b {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 40px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .marca span {
    color: var(--cinza);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  h1 {
    max-width: 17ch;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 96px;
    line-height: 0.92;
    text-transform: uppercase;
  }
  h1 em { font-style: normal; color: var(--brand-green); }

  .rodape {
    position: relative;
    display: flex;
    align-items: center;
    gap: 28px;
    margin-top: 40px;
    padding-top: 30px;
    border-top: 1px solid rgb(255 255 255 / 0.14);
    font-size: 25px;
    color: var(--cinza);
  }
  .rodape b { color: var(--branco); font-weight: 600; }
  .ponto { width: 7px; height: 7px; border-radius: 50%; background: var(--brand-green); }
  .zap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 26px;
    border-radius: 999px;
    background: linear-gradient(115deg, var(--brand-blue), var(--brand-green));
    color: var(--preto);
    font-size: 25px;
    font-weight: 600;
  }
  .zap svg { width: 27px; height: 27px; fill: currentColor; display: block; }
</style>
</head>
<body>
  <div class="halo"></div>
  <div class="grade"></div>

  <div class="conteudo">
    <div class="marca">
      <img src="/assets/zforce-mark.webp" alt="">
      <div>
        <b>Z-Force</b><br>
        <span>Mobilidade elétrica</span>
      </div>
    </div>

    <h1>Conserto de patinete, scooter e <em>bike elétrica</em></h1>

    <div class="rodape">
      <span class="ponto"></span>
      <span><b>Cafelândia, PR</b> — orçamento antes do serviço</span>
      <span class="zap">
        <svg viewBox="0 0 32 32"><path d="M16 3a12 12 0 0 0-10.3 18.2L4 28l7-1.8A12 12 0 1 0 16 3Z"/></svg>
        (45) 98803-7791
      </span>
    </div>
  </div>

  <script>
    // Avisa o script quando fontes e imagens terminaram: sem isso o print sai com fonte de sistema.
    Promise.all([
      document.fonts.ready,
      ...[...document.images].map(img => (img.complete ? null : new Promise(r => (img.onload = img.onerror = r)))),
    ]).then(() => requestAnimationFrame(() => requestAnimationFrame(() => (window.__pronto = true))));
  </script>
</body>
</html>
